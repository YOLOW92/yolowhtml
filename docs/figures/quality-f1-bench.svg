<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" width="100%" role="img">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 18.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -0.2px; }
    .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .panel-title { font: 700 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .panel-sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
    .label { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
    .label-hi { font: 700 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .val { font: 500 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #475569; }
    .val-hi { font: 700 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #4f46e5; }
    .val-teal { font: 700 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #0d9488; }
    .kpi-num { font: 800 22px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: -0.5px; }
    .kpi-title { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .kpi-sub { font: 400 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
    .badge { font: 700 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .code { font: 600 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #0f172a; }
    .note { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
  </style>
  <rect width="1040" height="360" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="0" y="0" width="1040" height="68" rx="14" fill="url(#headerGrad)"/>
  <rect x="0" y="54" width="1040" height="14" fill="url(#headerGrad)"/>
  <text x="26" y="30" class="title">yolowhtml — Extraction Quality, Markdown Fidelity &amp; Publication Date Accuracy</text>
  <text x="26" y="50" class="subtitle">Evaluated across 600 Markdown fidelity docs, AEB (150), WCXB (150), htmldate (1,000), and 166 hard web pages</text>
  <rect x="803" y="19" width="215" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="910.5" y="37" text-anchor="middle" class="badge" fill="#e0e7ff">Top Quality Across 5 Suites</text>
  <rect x="20" y="84" width="493.0" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
  <text x="38" y="109" class="panel-title">Main Content, Dates &amp; Hard Pages (F1 / Completion ↑)</text>
  <text x="38" y="127" class="panel-sub">yolowhtml vs best competing tool on each benchmark</text>
  <rect x="28" y="145" width="477.0" height="26" rx="5" fill="#eef2ff"/>
  <text x="138" y="162" text-anchor="end" class="label-hi">AEB News (150p)</text>
  <rect x="148" y="150" width="114.5" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="270.5" y="162" class="val-hi">0.954 F1  (vs trafilatura 0.950)</text>
  <text x="138" y="197" text-anchor="end" class="label-hi">htmldate (1,000p)</text>
  <rect x="148" y="185" width="113.4" height="16" rx="4" fill="url(#tealGrad)"/>
  <text x="269.4" y="197" class="val-teal">0.945 F1  (ties htmldate @ 13x)</text>
  <rect x="28" y="215" width="477.0" height="26" rx="5" fill="#eef2ff"/>
  <text x="138" y="232" text-anchor="end" class="label-hi">WCXB Test (150p)</text>
  <rect x="148" y="220" width="103.9" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="259.9" y="232" class="val-hi">0.866 F1  (vs Readability 0.848)</text>
  <text x="138" y="267" text-anchor="end" class="label-hi">WebMainBench</text>
  <rect x="148" y="255" width="100.0" height="16" rx="4" fill="url(#tealGrad)"/>
  <text x="256.0" y="267" class="val-teal">0.833 F1  (ties trafilatura 0.833)</text>
  <rect x="28" y="285" width="477.0" height="26" rx="5" fill="#eef2ff"/>
  <text x="138" y="302" text-anchor="end" class="label-hi">Hard Pages (166p)</text>
  <rect x="148" y="290" width="86.8" height="16" rx="4" fill="url(#primaryGrad)"/>
  <text x="242.8" y="302" class="val-hi">0.723 done  (vs crw 0.590)</text>
  <rect x="527.0" y="84" width="493.0" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
  <text x="545.0" y="109" class="panel-title">HTML → Markdown Structural Fidelity (Mean F1 ↑)</text>
  <text x="545.0" y="127" class="panel-sub">600 generated docs · Tables, Code, Lists, Math, Escaping</text>
  <rect x="535.0" y="145" width="477.0" height="26" rx="5" fill="#f0fdfa"/>
  <text x="631.0" y="162" text-anchor="end" class="label-hi">yolowhtml</text>
  <rect x="641.0" y="150" width="127.0" height="16" rx="4" fill="url(#tealGrad)"/>
  <text x="776.0" y="162" class="val-teal">1.000 F1  (Tables 1.00 · Math 1.00)</text>
  <text x="631.0" y="197" text-anchor="end" class="label">markdownify</text>
  <rect x="641.0" y="185" width="118.9" height="16" rx="4" fill="#94a3b8"/>
  <text x="767.9" y="197" class="val">0.936 F1  (Tables 0.83 · Math 0.34)</text>
  <text x="631.0" y="232" text-anchor="end" class="label">Defuddle</text>
  <rect x="641.0" y="220" width="115.8" height="16" rx="4" fill="#94a3b8"/>
  <text x="764.8" y="232" class="val">0.912 F1  (Lists 0.54 · Math 0.57)</text>
  <text x="631.0" y="267" text-anchor="end" class="label">html2text</text>
  <rect x="641.0" y="255" width="108.2" height="16" rx="4" fill="#94a3b8"/>
  <text x="757.2" y="267" class="val">0.852 F1  (Code 0.11 · Math 0.25)</text>
  <text x="631.0" y="302" text-anchor="end" class="label">Turndown</text>
  <rect x="641.0" y="290" width="101.5" height="16" rx="4" fill="#94a3b8"/>
  <text x="750.5" y="302" class="val">0.799 F1  (Tables 0.00 · Math 0.17)</text>
</svg>

[package]
description = "HTML to clean Markdown: main-content extraction, Markdown generation, publication dates and metadata, built for LLM pipelines."
name = "yolowhtml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aho-corasick = "1.1.5"
memchr = "2.8.3"
yolowhtml-dom = { version = "0.1.0", path = "../yolowhtml-dom" }
regex = "1.13.1"
serde_json = "1.0.154"
blake3 = { version = "1.8.7", features = ["pure"] }
unicode-normalization = "0.1.26"
url = "2.5.8"

[dev-dependencies]
yolowhtml-testkit = { path = "../yolowhtml-testkit" }
# 性能示例和发布的可执行程序用同一个全局分配器
yolowhtml-sys = { path = "../yolowhtml-sys" }
